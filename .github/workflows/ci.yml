name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The library supports react >=18 but is developed against the latest React
  react-18:
    name: Test on React 18
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install React 18
        run: |
          pnpm --filter ./packages/lib add -D react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18
          cd packages/lib && node -e 'const v = require("react/package.json").version; console.log(`react ${v}`); if (!v.startsWith("18.")) process.exit(1)'

      - name: Typecheck
        run: pnpm --filter ./packages/lib typecheck

      - name: Test
        run: pnpm --filter ./packages/lib test

  # Merges only after the checks above pass; major updates stay open for manual review
  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: [check, react-18]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: [check, react-18]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: pnpm release

      - name: Commit release files
        run: |
          git diff --quiet HEAD -- CHANGELOG.md packages/lib/package.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./packages/lib/package.json').version")
          git add CHANGELOG.md packages/lib/package.json
          git commit -m "chore(release): ${VERSION} [skip ci]"
          git push
